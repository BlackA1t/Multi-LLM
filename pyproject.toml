[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "multi-llm-p04"
version = "0.1.0"
description = "Financially safe, deny-by-default multi-provider CLI prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "keyring>=25,<26",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
multi-llm = "multi_llm.cli:main"
multi-llm-native-host = "multi_llm.research.native_host:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_llm"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
